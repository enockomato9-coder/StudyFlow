<style>

@keyframes slowZoom{from{transform:scale(1.03)}to{transform:scale(1.09)}}
.landing-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.landing-mini div{padding:13px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);font-size:10px;color:rgba(255,255,255,.7)}.landing-mini strong{display:block;color:#fff;font-size:13px;margin-bottom:4px}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:

.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);padding:10px 12px}

.menu{display:none}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:19px;white-space:nowrap}.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 8px 20px rgba(79,70,229,.25)}

.layout{display:flex;padding-top:70px}.sidebar{position:fixed;top:70px;left:0;bottom:0;width:250px;background:var(--sidebar);border-right:1px solid var(--border);padding:16px 12px;overflow:auto;z-index:900}

.nav{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 13px;border-radius:11px;display:flex;align-items:center;gap:10px;font-weight:800;text-align:left;margin:2px 0}.nav:hover{background:var(--bg);color:var(--primary)}.nav.active{background:var(--soft);color:var(--primary)}
.main{margin-left:250px;width:calc(100% - 250px);max-width:1650px;padding:28px}.view{display:none;animation:fade .2s ease}.view.active{display:block}@keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}

.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.card h3{margin:0 0 13px;font-size:15px}
.stat{padding:19px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-25px;bottom:-30px;width:105px;height:105px;border-radius:50%;background:var(--soft)}.stat .num{font-size:30px;font-weight:950}.stat .label{color:var(--muted);font-size:12px;margin-top:4px}.stat .trend{margin-top:10px;font-size:11px;font-weight:850;color:var(--success)}
.list{display:grid;gap:10px}.item{border:1px solid var(--border);border-radius:13px;padding:13px;background:var(--card);display:flex;gap:11px;align-items:flex-start}.item-main{flex:1;min-width:0}.item-title{font-weight:850;font-size:14px}.item-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:6px}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:950;text-transform:uppercase}.pill.high{color:var(--danger);background:rgba(220,38,38,.1)}.pill.medium{color:var(--warning);background:rgba(217,119,6,.1)}.pill.low{color:var(--success);background:rgba(5,150,105,.1)}

.empty{text-align:center;padding:42px 18px;color:var(--muted)}.empty .ico{font-size:36px;margin-bottom:8px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--border);font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase}

.timeline{display:grid;gap:0}.timeline-row{display:grid;grid-template-columns:105px 1fr;gap:15px;padding:13px 0;border-bottom:1px solid var(--border)}.timeline-date{font-size:11px;color:var(--muted);font-weight:800}.timeline-body{position:relative;padding-left:18px}.timeline-body:before{content:"";position:absolute;left:0;top:5px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.skill-row{border:1px solid var(--border);border-radius:14px;padding:14px}.skill-head{display:flex;justify-content:space-between;gap:10px}.history{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted)}

.timer{text-align:center;max-width:760px;margin:auto}.timer-display{font-size:clamp(70px,13vw,125px);font-weight:950;letter-spacing:-5px;color:var(--primary);margin:22px 0}.timer-ring{width:240px;height:240px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(var(--primary) var(--pct,0%),var(--bg) 0);padding:12px}.timer-ring>div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--card)}

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);
  r.onupgradeneeded=e=>{
   const d=e.target.result;
   if(!d.objectStoreNames.contains("users")){const s=d.createObjectStore("users",{keyPath:"id"});s.createIndex("username","username",{unique:true})}
   if(!d.objectStoreNames.contains("data")){const s=d.createObjectStore("data",{keyPath:"id"});s.createIndex("userId","userId",{unique:true})}
   if(!d.objectStoreNames.contains("files")){const s=d.createObjectStore("files",{keyPath:"id"});s.createIndex("userId","userId")}
  };
  r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error);
 });
}
function idb(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function put(store,obj){return new Promise((res,rej)=>{const r=idb(store,"readwrite").put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function get(store,key){return new Promise((res,rej)=>{const r=idb(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getAllByIndex(store,index,value){return new Promise((res,rej)=>{const r=idb(store).index(index).getAll(value);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(store,key){return new Promise((res,rej)=>{const r=idb(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function sha256(text){
 const b=new TextEncoder().encode(text),h=await crypto.subtle.digest("SHA-256",b);
 return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function hashPassword(password,salt){return sha256(password+"::"+salt)}
function randomSalt(){return crypto.getRandomValues(new Uint8Array(16)).reduce((s,x)=>s+x.toString(16).padStart(2,"0"),"")}
async function createUser(username,password,name,email,hint){
 username=username.trim().toLowerCase();
 if(!/^[a-z0-9._-]{3,30}$/.test(username))throw new Error("Username must be 3–30 characters: letters, numbers, dot, underscore or hyphen.");
 if(password.length<6)throw new Error("Password must contain at least 6 characters.");
 const exists=await new Promise((res,rej)=>{const r=idb("users").index("username").get(username);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 if(exists)throw new Error("That username already exists on this device.");
 const salt=randomSalt(),id=uid("user"),passHash=await hashPassword(password,salt);
 const user={id,username,passwordHash:passHash,salt,name:name.trim(),email:email.trim(),passwordHint:hint.trim(),createdAt:Date.now()};
 await put("users",user);
 await put("data",{id:user.id,userId:user.id,profile:{name:user.name,email:user.email,course:"BSc Mathematics & Computer Science",year:"Year 2",bio:"",phone:"",location:"Kenya",city:"",county:"",country:"Kenya",address:"",postalAddress:"",headline:"Computer Science & Mathematics student building real software."},subjects:[],tasks:[],notes:[],documents:[],projects:[],achievements:[],diary:[],notifications:[],skills:[],skillHistory:[],schedule:[],sessions:0,focusMinutes:0,activity:[],theme:"light",settings:{reminders:true,desktopNotifications:false,lockAfterMinutes:0},createdAt:Date.now(),updatedAt:Date.now()});
 return user;
}
async function authenticate(username,password){
 const user=await new Promise((res,rej)=>{const r=idb("users").index("username").get(username.trim().toLowerCase());r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 if(!user)throw new Error("Account not found on this device.");
 const ok=await hashPassword(password,user.salt)===user.passwordHash;
 if(!ok)throw new Error("Incorrect username or password.");
 return user;
}

 const d=new Date(date),day=d.getDay(),h=d.getHours(),m=d.getMinutes(),t=h*60+m;
 return (day===5&&t>=18*60)||(day===6&&t<18*60);
}

async function lookupRecoveryHint(){
 const username=$("#rec-user")?.value.trim().toLowerCase(),box=$("#recovery-hint"),txt=$("#recovery-hint-text");

function drawCalendar(){

 for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;html+=calendarDayHTML(d,iso,false)}
 const total=Math.ceil((start+days)/7)*7;for(let d=1;d<=total-start-days;d++){const nm=(m+1)%12,ny=m===11?y+1:y,iso=`${ny}-${String(nm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;html+=calendarDayHTML(d,iso,true)}
 el.innerHTML=html;
}

async function saveProject(e,id){
 e.preventDefault();
 try{
  const existing=id?currentUserData.projects.find(x=>x.id===id):null;
  const p=existing||{id:uid("project"),createdAt:Date.now()};
  p.title=$("#m-p-title").value.trim();p.status=$("#m-p-status").value;p.description=$("#m-p-desc").value.trim();
  p.tech=$("#m-p-tech").value.trim();p.skills=$("#m-p-skills").value.trim();p.github=$("#m-p-github").value.trim();p.demoUrl=$("#m-p-demo").value.trim();p.code=$("#m-p-code").value;p.publish=$("#m-p-publish").checked;p.updatedAt=Date.now();
  const img=$("#m-p-image").files[0],local=$("#m-p-local").files[0],codeFile=$("#m-p-code-file").files[0];
  if(codeFile)p.code=await readFileText(codeFile);
  if(img)p.image=await readFileData(img);
  if(local)p.localDemo=await readFileData(local);
  if(!id)currentUserData.projects.unshift(p);
  activity("project",id?"Updated project":"Added project",p.title);

 }catch(err){toast(err.message||"Could not save project","error")}
}

function timerView(){
 return `<section class="view active"><div class="page-head"><div><h1>Focus Timer</h1><p class="muted">Use focused sessions to build consistent study habits.</p></div></div>${sabbathMessage()}<div class="card timer"><div class="actions" style="justify-content:center"><button class="btn sm" onclick="setTimer(25)">25 min</button><button class="btn sm" onclick="setTimer(45)">45 min</button><button class="btn sm" onclick="setTimer(60)">60 min</button><button class="btn sm" onclick="setTimer(5)">5 min</button></div><div class="timer-ring" id="timer-ring"><div><div class="timer-display" id="timer-display">25:00</div></div></div><div class="timer-controls actions" style="justify-content:center"><button class="btn primary" onclick="startTimer()">▶ Start</button><button class="btn" onclick="pauseTimer()">⏸ Pause</button><button class="btn" onclick="resetTimer()">↻ Reset</button></div><p class="muted small" style="margin-top:20px">Sessions: <b id="session-count">${currentUserData.sessions}</b> · Total focus: <b>${Math.floor(currentUserData.focusMinutes/60)}h ${currentUserData.focusMinutes%60}m</b></p></div></section>`;
}
function updateTimerUI(){const d=$("#timer-display"),r=$("#timer-ring");if(!d||!r)return;const m=Math.floor(timer.seconds/60),s=timer.seconds%60;d.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;r.style.setProperty("--pct",((timer.initial-timer.seconds)/timer.initial*100)+"%")}
function setTimer(min){pauseTimer();timer.initial=timer.seconds=min*60;updateTimerUI()}
function startTimer(){if(isSabbath()){toast("Focus timer is paused during your protected Sabbath time.","error");return}if(timer.running)return;timer.running=true;timer.interval=setInterval(()=>{if(isSabbath()){pauseTimer();toast("Sabbath protection activated. Timer paused.","info");return}timer.seconds--;updateTimerUI();if(timer.seconds<=0){pauseTimer();currentUserData.sessions++;const mins=Math.round(timer.initial/60);currentUserData.focusMinutes+=mins;activity("focus",`Completed ${mins}-minute focus session`,`${mins} minutes`);addNotification("Focus session completed",`You completed ${mins} minutes of focused work.`,"success");saveData();toast("Focus session completed 🎉","success");if(route()==="timer")$("#session-count").textContent=currentUserData.sessions}} ,1000)}
function pauseTimer(){timer.running=false;if(timer.interval){clearInterval(timer.interval);timer.interval=null}}
function resetTimer(){pauseTimer();timer.seconds=timer.initial;updateTimerUI()}

function drawNotifications(){}
async function markRead(id){const n=currentUserData.notifications.find(x=>x.id===id);if(n)n.read=true;await saveData();render()}
async function markAllRead(){currentUserData.notifications.forEach(n=>n.read=true);await saveData();render();toast("Notifications cleared","success")}
async function checkReminders(){
 if(!currentUserData?.settings?.reminders||isSabbath())return;
 const today=isoToday(),tomorrow=daysFromToday(1),existing=new Set(currentUserData.notifications.filter(n=>Date.now()-n.date<86400000).map(n=>n.message));
 const due=currentUserData.tasks.filter(t=>!t.done&&(t.deadline===today||t.deadline===tomorrow));
 let changed=false;
 due.forEach(t=>{const msg=`${t.title} is due ${t.deadline===today?"today":"tomorrow"}.`;if(!existing.has(msg)){addNotification("Upcoming task",msg,t.priority==="high"?"warning":"info");changed=true}});
 if(changed){await saveData();if(route()==="notifications")render()}
}

async function enableDesktopNotifications(on){
 currentUserData.settings.desktopNotifications=on;
 if(on&&"Notification" in window){try{const p=await Notification.requestPermission();if(p!=="granted"){currentUserData.settings.desktopNotifications=false;toast("Notification permission was not granted.","error")}}catch{currentUserData.settings.desktopNotifications=false}}

function globalSearch(q){
 if(!q.trim()||q.trim().length<2)return;
 const s=q.toLowerCase(),hits=[
  ...currentUserData.tasks.map(x=>({type:"Task",title:x.title,view:"tasks"})),
  ...currentUserData.notes.map(x=>({type:"Note",title:x.title,view:"notes"})),
  ...currentUserData.skills.map(x=>({type:"Skill",title:x.name,view:"skills"})),
  ...currentUserData.achievements.map(x=>({type:"Achievement",title:x.title,view:"achievements"})),
  ...currentUserData.subjects.map(x=>({type:"Unit",title:x.code+" "+x.name,view:"semester"}))
 ].filter(x=>x.title.toLowerCase().includes(s));
 if(hits.length)toast(`${hits.length} result${hits.length>1?"s":""}: ${hits.slice(0,3).map(x=>x.title).join(" · ")}`);
}

async function saveSubject(e,id){e.preventDefault();const o={id:id||uid("sub"),code:$("#m-s-code").value.trim().toUpperCase(),name:$("#m-s-name").value.trim(),type:$("#m-s-type").value.trim(),description:$("#m-s-desc").value.trim(),color:$("#m-s-color").value,progress:+$("#m-s-progress").value};if(id)currentUserData.subjects=currentUserData.subjects.map(x=>x.id===id?o:x);else currentUserData.subjects.push(o);activity(id?"unit-updated":"unit-added",id?"Updated unit":"Added unit",o.code);await saveData();closeModal();render();toast(id?"Unit updated":"Unit added","success")}

function loadSemesterTemplate(showToast=true){
 const existing=new Set(currentUserData.subjects.map(s=>s.code));
 SEMESTER_UNITS.forEach(s=>{if(!existing.has(s.code))currentUserData.subjects.push({...s,id:uid("sub"),progress:0,description:""});
 });
 const existingSlots=new Set(currentUserData.schedule.map(x=>x.day+"|"+x.start+"|"+x.code));
 TIMETABLE.forEach(x=>{const key=x.day+"|"+x.start+"|"+x.code;if(!existingSlots.has(key))currentUserData.schedule.push({...x,id:uid("slot")})});
 activity("semester-template","Loaded semester template","8 compulsory units + timetable");
 addNotification("Semester loaded","Your 8 compulsory units and timetable are ready. Start assigning weekly tasks.","success");
 saveAndRender(showToast?"8-unit semester loaded":"");
}

async function saveDocument(e){e.preventDefault();const f=$("#m-d-file").files[0];const d={id:uid("doc"),title:$("#m-d-title").value.trim(),kind:$("#m-d-kind").value,date:$("#m-d-date").value,description:$("#m-d-desc").value.trim(),created:Date.now(),fileName:f?.name||"",fileType:f?.type||"",fileSize:f?.size||0};currentUserData.documents.push(d);if(f){await put("files",{id:d.id,userId:currentUser.id,name:f.name,type:f.type,size:f.size,blob:f,created:Date.now()})}activity("document", "Added document",d.title);await saveData();closeModal();render();toast("Document saved","success")}
async function viewDocument(id){const d=currentUserData.documents.find(x=>x.id===id);if(!d)return;const f=await get("files",id);if(f?.blob){const url=URL.createObjectURL(f.blob);window.open(url,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(url),60000)}else openModal("documentView",id)}
async function printDocument(id){const d=currentUserData.documents.find(x=>x.id===id);if(!d)return;const w=window.open("","_blank");if(!w){toast("Allow pop-ups to print documents.","error");return}w.document.write(`<html><head><title>${esc(d.title)}</title><style>body{font-family:Arial;padding:45px;line-height:1.6}h1{font-size:25px}small{color:#64748b}</style></head><body><h1>${esc(d.title)}</h1><small>${esc(d.kind)} · ${esc(d.date)}</small><hr><p>${esc(d.description||"")}</p><p>StudyFlow document record.</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function documentViewModal(id){
 const d=currentUserData.documents.find(x=>x.id===id);if(!d)return `<div class="modal-head"><h2>Document</h2><button class="btn icon" onclick="closeModal()">×</button></div><p class="muted">Document not found.</p>`;
 return `<div class="modal-head"><h2>${esc(d.title)}</h2><button class="btn icon" onclick="closeModal()">×</button></div><div class="banner"><strong>${esc(d.kind)}</strong><span class="small">${esc(d.date)} ${d.fileName?"· "+esc(d.fileName):""}</span></div><p style="line-height:1.7;white-space:pre-wrap">${esc(d.description||"No description recorded.")}</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="printDocument('${d.id}')">Print/PDF</button></div>`;
}

async function deleteDocument(id){if(!confirm("Delete this document record and its stored file?"))return;currentUserData.documents=currentUserData.documents.filter(x=>x.id!==id);try{await del("files",id)}catch{}await saveData();render();toast("Document deleted")}

async function saveDiary(e,id){e.preventDefault();const old=id?currentUserData.diary.find(x=>x.id===id):null,o={id:id||uid("diary"),title:$("#m-di-title").value.trim(),content:$("#m-di-content").value.trim(),lesson:$("#m-di-lesson").value.trim(),date:old?.date||Date.now()};if(id)currentUserData.diary=currentUserData.diary.map(x=>x.id===id?o:x);else currentUserData.diary.unshift(o);activity("diary","Diary entry",o.title);await saveData();closeModal();render();toast("Diary entry saved","success")}

function skillModal(id){
 const s=id?currentUserData.skills.find(x=>x.id===id):{name:"",category:"Technical",level:0,note:""};

async function saveSkill(e,id){e.preventDefault();const name=$("#m-sk-name").value.trim(),level=+$("#m-sk-level").value,note=$("#m-sk-note").value.trim(),cat=$("#m-sk-cat").value.trim();if(id){const s=currentUserData.skills.find(x=>x.id===id);const old=s.level;s.name=name;s.category=cat;s.level=level;s.note=note;s.history=s.history||[];if(old!==level)s.history.push({date:Date.now(),from:old,to:level,note});currentUserData.skillHistory.push({id:uid("sh"),skill:name,date:Date.now(),from:old,to:level,note});activity("skill-change","Skill level changed",`${name}: ${old} → ${level}`)}else{currentUserData.skills.push({id:uid("skill"),name,category:cat,level,note,history:[{date:Date.now(),from:0,to:level,note}]});currentUserData.skillHistory.push({id:uid("sh"),skill:name,date:Date.now(),from:0,to:level,note});activity("skill-added","Added skill",name)}await saveData();closeModal();render();toast("Skill saved and history updated","success")}

async function saveAchievement(e,id){e.preventDefault();const old=id?currentUserData.achievements.find(x=>x.id===id):null,o={id:id||uid("ach"),title:$("#m-a-title").value.trim(),type:$("#m-a-type").value,icon:$("#m-a-icon").value.trim()||"🏆",date:$("#m-a-date").value,description:$("#m-a-desc").value.trim()};if(id)currentUserData.achievements=currentUserData.achievements.map(x=>x.id===id?o:x);else currentUserData.achievements.push(o);activity("achievement",id?"Updated achievement":"Achievement added",o.title);await saveData();closeModal();render();toast("Achievement saved","success")}
async function deleteAchievement(id){if(!confirm("Delete this achievement?"))return;currentUserData.achievements=currentUserData.achievements.filter(x=>x.id!==id);await saveData();render();toast("Achievement deleted")}

function passwordModal(){
 return `<div class="modal-head"><h2>Change Password</h2><button class="btn icon" onclick="closeModal()">×</button></div>
 <form onsubmit="savePasswordChange(event)">
 <div class="field"><label>Current password *</label><input class="input" id="m-old-pass" type="password" required autocomplete="current-password"></div>
 <div class="form-row"><div class="field"><label>New password *</label><input class="input" id="m-new-pass" type="password" minlength="6" required autocomplete="new-password"></div><div class="field"><label>Confirm new password *</label><input class="input" id="m-new-pass2" type="password" minlength="6" required autocomplete="new-password"></div></div>
 <div class="field"><label>Password hint *</label><input class="input" id="m-pass-hint" maxlength="120" required value="${esc(currentUser.passwordHint||"")}"></div>
 <p class="small muted">Choose a hint that helps you remember the password without revealing the password itself.</p>
 <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Update password</button></div></form>`;
}
async function savePasswordChange(e){
 e.preventDefault();
 try{
  const old=$("#m-old-pass").value,u=await get("users",currentUser.id);
  if(!u||await hashPassword(old,u.salt)!==u.passwordHash)throw new Error("Current password is incorrect.");
  const p=$("#m-new-pass").value;if(p!==$("#m-new-pass2").value)throw new Error("New passwords do not match.");
  if(p.length<6)throw new Error("Password must contain at least 6 characters.");
  const hint=$("#m-pass-hint").value.trim();if(!hint)throw new Error("Password hint is required.");
  const salt=randomSalt();u.salt=salt;u.passwordHash=await hashPassword(p,salt);u.passwordHint=hint;await put("users",u);currentUser=u;
  closeModal();render();toast("Password and recovery hint updated","success");
 }catch(err){toast(err.message||"Could not change password","error")}
}

function printPage(v){

  const view=$("#main .view");

  view.classList.add("print-target");
  window.print();
  setTimeout(()=>view.classList.remove("print-target"),800);
 },180);
}

async function exportBackup(){
 const safe={version:APP_VERSION,exportedAt:new Date().toISOString(),user:{username:currentUser.username,name:currentUser.name,email:currentUser.email},data:currentUserData};
 const blob=new Blob([JSON.stringify(safe,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`studyflow-${currentUser.username}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Account backup exported","success");
}
async function importBackup(e){
 const f=e.target.files[0];if(!f)return;try{const text=await f.text(),x=JSON.parse(text);if(!x.data)throw new Error("This is not a StudyFlow backup.");currentUserData=x.data;currentUserData.id=currentUser.id;currentUserData.userId=currentUser.id;await saveData();render();toast("Backup imported","success")}catch(err){toast(err.message||"Import failed","error")}e.target.value=""}

document.addEventListener("click",e=>{if(e.target.id==="active-modal")closeModal()});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&modalOpen)closeModal();
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"&&!currentUser&&$("#login-user")){e.preventDefault();renderAuth("recover");return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#global-search")?.focus()}
 if(!currentUser||e.ctrlKey||e.metaKey)return;
 if(e.key.toLowerCase()==="d")nav("dashboard");if(e.key.toLowerCase()==="t")nav("tasks");if(e.key.toLowerCase()==="n")nav("notes");
});
window.addEventListener("hashchange",()=>{if(currentUser){currentView=route();renderShell();renderView(currentView)}});
window.addEventListener("beforeunload",()=>pauseTimer());

(async function boot(){
 try{
  await openDB();
  const sid=sessionStorage.getItem(SESSION_KEY);
  if(sid){currentUser=await get("users",sid);if(currentUser){if(currentUser.passwordHint===undefined){currentUser.passwordHint="No hint saved — use Profile → Change password to create one.";await put("users",currentUser)}currentUserData=await loadData(sid)}}
  if(currentUser&&currentUserData)render();else renderAuth();
 }catch(e){document.body.innerHTML=`<div style="padding:30px;font-family:Arial"><h2>StudyFlow could not start</h2><p>Your browser may have IndexedDB disabled. Try a current Chrome, Edge or Firefox browser.</p><pre>${esc(e.message)}</pre></div>`}
})();
</script>
